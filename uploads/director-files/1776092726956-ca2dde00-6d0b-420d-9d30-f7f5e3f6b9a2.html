<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFCS Financial Report Viewer - FY 2025</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        #viewer { max-width: 1000px; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #canvas { border: 1px solid #ddd; display: block; margin: 10px auto; }
        .page { margin: 20px; }
        #message { text-align: center; color: #666; }
        /* Disable print/save */
        @media print { body * { visibility: hidden; } }
        /* Disable right-click */
        body { user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
        canvas { pointer-events: none; }
    </style>
</head>
<body>
    <div id="viewer">
        <h1>Kabianga Farmers Cooperative Society Financial Statement FY 2025</h1>
        <p>This report can be viewed online only. Downloading is disabled for security.</p>
        <div id="message">Loading report...</div>
        <div id="pages"></div>
    </div>

    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

        const pdfUrl = '/attached_assets/KABIANGA FARMERS COOPERATIVE SOCIETY FINANCIAL STATEMENT FY 2025.pdf'; // Adjust base URL if needed
        const pagesContainer = document.getElementById('pages');
        const message = document.getElementById('message');

        async function loadPDF() {
            try {
                // Fetch as blob
                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error('PDF not found');
                const blob = await response.blob();
                const arrayBuffer = await blob.arrayBuffer();

                // Load PDF
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                // Render all pages
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.className = 'page-canvas';
                    canvas.id = `page-${pageNum}`;

                    const context = canvas.getContext('2d');
                    await page.render({ canvasContext: context, viewport }).promise;

                    const div = document.createElement('div');
                    div.className = 'page';
                    div.appendChild(canvas);
                    pagesContainer.appendChild(div);
                }

                message.textContent = `Report loaded (${pdf.numPages} pages). Zoom/pan with mouse. No download/print allowed.`;
                // Cleanup arrayBuffer (URL not needed since direct render)
            } catch (error) {
                message.innerHTML = `Error loading report: ${error.message}<br>Use: <a href="${pdfUrl}" target="_blank">direct link</a> (temporary)`;
            }
        }

        // Disable right-click
        document.addEventListener('contextmenu', e => e.preventDefault());
        // Disable print keys
        document.addEventListener('keydown', e => {
            if (e.key === 'p' && (e.ctrlKey || e.metaKey)) e.preventDefault();
            if (e.key === 's' && (e.ctrlKey || e.metaKey)) e.preventDefault();
        });

        loadPDF();
    </script>
</body>
</html>
